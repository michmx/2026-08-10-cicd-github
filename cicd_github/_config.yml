# Jupyter Book configuration
# See https://jupyterbook.org/customize/config.html

#######################################################################################
# Book settings
title: CI/CD with GitHub Actions
author: HSF Training
copyright: "2026"
logo: hsf-logo.png

# Pages are prose-only MyST Markdown; nothing to execute.
execute:
  execute_notebooks: "off"

# Only build files listed in _toc.yml (avoids orphan-page warnings under -W).
only_build_toc_files: true

# Information about where the book exists on the web
repository:
  url: https://github.com/hsf-training/hsf-training-cicd-github
  path_to_book: cicd_github
  branch: gh-pages

# Add GitHub buttons to the book
html:
  use_issues_button: true
  use_repository_button: true
